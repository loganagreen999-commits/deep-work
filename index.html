}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --on-accent:#12141A;

}}

<script>
/* ================= state ================= */
const LSK={sessions:"fx.sessions",tasks:"fx.tasks",cfg:"fx.cfg",live:"fx.live",pending:"fx.pending",
           blocks:"fx.blocks",checks:"fx.checks"};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const S={
  view:"focus",
  sessions:lsGet(LSK.sessions,[]),      /* finished ones, newest last */
  tasks:lsGet(LSK.tasks,{}),            /* name -> {est,spent,sessions,done} */
  cfg:Object.assign({dur:45,est:20,brk:5,sawGA:false,sync:""},lsGet(LSK.cfg,{})),
  live:lsGet(LSK.live,null),            /* a session in progress, survives a reload */
  pending:lsGet(LSK.pending,null),      /* a finished break waiting to be answered */
  blocks:lsGet(LSK.blocks,[]),          /* where the day is supposed to happen */
  checks:lsGet(LSK.checks,[])           /* every arrival and departure, with distance */
};
const saveS=()=>lsSet(LSK.sessions,S.sessions);
const saveT=()=>lsSet(LSK.tasks,S.tasks);
const saveC=()=>lsSet(LSK.cfg,S.cfg);
const saveL=()=>{S.live?lsSet(LSK.live,S.live):localStorage.removeItem(LSK.live)};
const saveP=()=>{S.pending?lsSet(LSK.pending,S.pending):localStorage.removeItem(LSK.pending)};
const saveBlocks=()=>lsSet(LSK.blocks,S.blocks);
const saveChecks=()=>lsSet(LSK.checks,S.checks);

/* ================= util ================= */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clock=ms=>{const s=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+":"+pad(m)+":"+pad(x):m+":"+pad(x)};
const mins=ms=>Math.round(ms/60000);
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
const keyOf=n=>String(n||"").trim().toLowerCase();
function toast(t){
  const h=document.getElementById("toastHost");
  h.innerHTML='<div class="toast">'+esc(t)+"</div>";
  clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2600);
}
const REASONS=[["phone","My phone"],["stuck","Got stuck"],["tired","Ran out of steam"],
  ["interrupt","Someone interrupted"],["early","Finished early"],["other","Something else"]];
const REASON_LABEL=c=>(REASONS.find(r=>r[0]===c)||[,"Unknown"])[1];
/* finishing early is a win, not a lapse — it must not cost the streak */
const isLapse=s=>s.kind!=="break"&&s.ended==="bail"&&s.reason!=="early";
const isWork=s=>s.kind!=="break";
const works=()=>S.sessions.filter(isWork);
const breaks=()=>S.sessions.filter(s=>s.kind==="break");

/* streak = consecutive completed sessions, newest backwards */
function streak(){
  const w=works(); let n=0;
  for(let i=w.length-1;i>=0;i--){ if(isLapse(w[i]))break; n++ }
  return n;
}
function bestStreak(){
  let best=0,n=0;
  for(const s of works()){ if(isLapse(s)){best=Math.max(best,n);n=0} else n++ }
  return Math.max(best,n);
}
/* how far past their length the breaks actually run */
function breakDrift(){
  const b=breaks().filter(x=>x.overrun!=null);
  if(!b.length)return null;
  const planned=b.reduce((a,x)=>a+x.planned,0);
  const over=b.reduce((a,x)=>a+x.overrun,0);
  return {n:b.length,planned:planned,over:over,avg:over/b.length,
          real:(planned+over)/b.length,ratio:planned>0?(planned+over)/planned:0};
}
/* how much longer things really take than you think */
function multiplier(){
  let est=0,act=0;
  for(const t of Object.values(S.tasks))
    if(t.done&&t.est>0&&t.spent>0){est+=t.est;act+=t.spent}
  return est>0?act/est:0;
}

/* ================= sync (optional, laptop on the same wifi) ================= */
/* An https page may not call a plain-http LAN address -- browsers block it as
   mixed content, and localhost is the only exemption. So this only does
   anything when the app itself was opened from the laptop. Say so rather than
   failing silently, and use the Shortcut route for the real thing. */
function syncBlocked(url){
  const base=(url!==undefined?url:(S.cfg.sync||""));
  if(!base)return "";
  if(location.protocol!=="https:")return "";
  if(!/^http:/i.test(base))return "";
  if(/\/\/(localhost|127\.0\.0\.1)([:/]|$)/i.test(base))return "";
  return "This page is on https, so the browser will not let it call a plain http address. "+
         "Use the Shortcut that focus serve prints instead.";
}
async function syncUp(){
  const base=(S.cfg.sync||"").replace(/\/+$/,"");
  if(!base||syncBlocked())return;
  try{
    const r=await fetch(base+"/api/sessions",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sessions:S.sessions})});
    if(r.ok){const j=await r.json(); if(j&&j.added!=null)return j.added}
  }catch(e){}
  return null;
}
</script>
<script>
/* ================= the session ================= */
let tick=null, wakeLock=null, actx=null;

function audioReady(){                 /* must be called from a real tap */
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
  }catch(e){actx=null}
}
function alarm(times){
  try{
    if(!actx)return;
    for(let i=0;i<(times||3);i++){
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.45;
      o.type="sine"; o.frequency.setValueAtTime(i%2?784:588,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.35,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.36);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.4);
    }
  }catch(e){}
  try{ if(navigator.vibrate)navigator.vibrate([180,90,180,90,260]) }catch(e){}
}

async function keepAwake(on){
  try{
    if(on){ if("wakeLock" in navigator && !wakeLock) wakeLock=await navigator.wakeLock.request("screen") }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null }
  }catch(e){ wakeLock=null }
}
document.addEventListener("visibilitychange",()=>{
  if(!S.live)return;
  if(document.hidden){
    S.live.leftAt=Date.now();
  }else{
    if(S.live.leftAt){
      const away=Date.now()-S.live.leftAt;
      if(away>1200){ S.live.leaves.push(Math.round(away/1000)); }  /* ignore a flicker */
      S.live.leftAt=0;
    }
    keepAwake(true);
  }
  saveL();
});

function startSession(task,course,durMin,estMin){
  S.pending=null; saveP();
  S.live={id:uid(),kind:"work",task:task,course:course||"",start:Date.now(),
          dur:durMin*60000,est:estMin,leaves:[],leftAt:0};
  const k=keyOf(task);
  if(!S.tasks[k])S.tasks[k]={name:task,course:course||"",est:estMin,spent:0,sessions:0,done:false};
  saveL(); saveT();
  keepAwake(true);
  renderRun();
}
function finishSession(how,reason){
  if(!S.live)return;
  const l=S.live, worked=Math.min(Date.now()-l.start,l.dur);
  const rec={id:l.id,kind:l.kind||"work",task:l.task,course:l.course,at:l.start,
    planned:mins(l.dur),actual:mins(worked),est:l.est,
    ended:how,reason:reason||"",leaves:l.leaves.length,
    awaySec:l.leaves.reduce((a,b)=>a+b,0)};
  if(l.kind!=="break"){
    const k=keyOf(l.task), t=S.tasks[k];
    if(t){ t.spent+=rec.actual; t.sessions++; }
  }
  S.sessions.push(rec);
  S.live=null;
  saveS(); saveT(); saveL();
  clearInterval(tick); tick=null;
  document.getElementById("runHost").innerHTML="";
  syncUp();
  if(l.kind==="break"){ keepAwake(false); breakOver(rec,l); return }
  keepAwake(false);
  askOutcome(rec);
}

/* ---- breaks ----
   A break runs on the same locked screen, so it cannot quietly become an hour
   of scrolling. When it ends it does not just stop: it demands an answer, and
   the default answer is back to work. */
function startBreak(minutes,task,course,est){
  audioReady();
  S.pending=null; saveP();
  S.live={id:uid(),kind:"break",task:task,course:course||"",start:Date.now(),
          dur:minutes*60000,est:est||0,leaves:[],leftAt:0};
  saveL(); keepAwake(true); renderRun();
}
/* the break's clock ran out: hold the user to the return */
function breakOver(rec,live){
  alarm(3);
  S.pending={task:live.task,course:live.course,est:live.est,
             dur:S.cfg.dur,brk:rec.planned,endedAt:Date.now(),recId:rec.id};
  saveP();
  renderResume();
}
/* how long past the end of the break they actually came back */
function closePending(startNow){
  const p=S.pending; if(!p)return;
  const over=Math.max(0,Math.round((Date.now()-p.endedAt)/60000));
  const rec=S.sessions.find(x=>x.id===p.recId);
  if(rec){ rec.overrun=over; saveS() }
  S.pending=null; saveP();
  document.getElementById("runHost").innerHTML="";
  if(startNow){ startSession(p.task,p.course,p.dur,p.est) }
  else { S.view="focus"; render();
         toast(over>0?"Break ran "+over+" min over":"Stopped for now") }
}

/* after the clock stops: did the assignment actually get done? */
function askOutcome(rec){
  const t=S.tasks[keyOf(rec.task)]||{est:rec.est,spent:rec.actual};
  openSheet(rec.ended==="done"?"Time's up":"Session ended",
    '<p class="s">'+esc(rec.task)+" &middot; "+rec.actual+" min"+
      (rec.ended==="bail"?" of "+rec.planned+", ended early":"")+"</p>"+
    '<div class="card"><span class="lab">Is this assignment finished?</span>'+
      '<div class="chips" id="finChips"><button data-fin="1">Yes, it is done</button>'+
      '<button data-fin="0">No, more to do</button></div>'+
      '<p class="note">Time on this assignment so far: <b>'+t.spent+' min</b>'+
      (t.est?', against the '+t.est+' min you guessed':"")+".</p></div>"+
    '<div class="card"><span class="lab">Break</span>'+
      '<div class="chips" id="brkChips">'+
        [5,10,15].map(m=>'<button data-brk="'+m+'">'+m+" min</button>").join("")+
        '<button data-brk="0">No break</button></div>'+
      '<p class="note">The break runs on the same locked screen and rings when it is up, so it '+
      "cannot quietly become an hour. Answer the question above first.</p></div>",
    el=>{
      let answered=false;
      const k=keyOf(rec.task);
      el.querySelectorAll("[data-fin]").forEach(b=>b.onclick=()=>{
        answered=true;
        const done=b.dataset.fin==="1";
        if(S.tasks[k]){S.tasks[k].done=done;saveT()}
        el.querySelectorAll("[data-fin]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
        if(done){
          const tt=S.tasks[k];
          if(tt&&tt.est>0&&tt.spent>0){
            const r=tt.spent/tt.est;
            toast(r>1.35?"Took "+r.toFixed(1)+"x your estimate":"Close to your estimate — nice");
          }else toast("Marked done");
        }
      });
      el.querySelectorAll("[data-brk]").forEach(b=>b.onclick=()=>{
        if(!answered){toast("Answer the question above first");return}
        const m=+b.dataset.brk;
        closeSheet();
        if(m>0){S.cfg.brk=m;saveC();startBreak(m,rec.task,rec.course,rec.est)}
        else{S.view="focus";render();toast("Straight on then")}
      });
    });
}

/* ================= run screen ================= */
function renderRun(){
  const host=document.getElementById("runHost");
  const R=88, C=2*Math.PI*R;
  const brk=S.live.kind==="break";
  host.innerHTML='<div class="run'+(brk?" brk":"")+'">'+
    '<p class="task">'+(brk?"Break":esc(S.live.task))+"</p>"+
    '<p class="course">'+(brk?"then back to "+esc(S.live.task):esc(S.live.course||""))+"</p>"+
    '<div class="ring"><svg viewBox="0 0 190 190">'+
      '<circle class="bg" cx="95" cy="95" r="'+R+'"/>'+
      '<circle class="fg" id="ringFg" cx="95" cy="95" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="0"/>'+
      "</svg>"+
      '<div class="mid"><p class="clock" id="clk">--:--</p></div></div>'+
    '<p class="est">'+(brk?"Stand up. Water. Look at something far away."
      :(S.live.est?"You guessed "+S.live.est+" min for this":""))+"</p>"+
    '<p class="leaves" id="lv"></p>'+
    '<div class="foot">'+
      (S.cfg.sawGA?"":'<p class="ga">Triple-click the side button now to lock the phone to this screen. '+
        "Settings &rsaquo; Accessibility &rsaquo; Guided Access turns it on.</p>")+
      '<button class="hold" id="bail"><i></i><span>'+
        (brk?"Hold to go back now":"Hold to end early")+"</span></button>"+
    "</div></div>";
  const fg=document.getElementById("ringFg"), clk=document.getElementById("clk"), lv=document.getElementById("lv");
  const paint=()=>{
    if(!S.live)return;
    const left=S.live.start+S.live.dur-Date.now();
    clk.textContent=clock(left);
    clk.classList.toggle("low",left<=60000);
    fg.setAttribute("stroke-dashoffset",String(C*(1-Math.max(0,Math.min(1,left/S.live.dur)))));
    const n=S.live.leaves.length;
    lv.textContent=n?("you left "+n+" time"+(n===1?"":"s")):"";
    if(left<=0)finishSession("done","");
  };
  paint();
  clearInterval(tick); tick=setInterval(paint,1000);
  holdToConfirm(document.getElementById("bail"),
    ()=>{ if(S.live&&S.live.kind==="break")finishSession("done",""); else askReason() });
}
/* a deliberate 1.6 s press, so quitting is never a reflex */
function holdToConfirm(btn,go){
  let t0=0,raf=0;
  const fill=btn.querySelector("i");
  const stop=()=>{cancelAnimationFrame(raf);fill.style.width="0%";t0=0};
  const step=()=>{
    const p=Math.min(1,(Date.now()-t0)/1600);
    fill.style.width=(p*100)+"%";
    if(p>=1){stop();go();return}
    raf=requestAnimationFrame(step);
  };
  const down=e=>{e.preventDefault();t0=Date.now();raf=requestAnimationFrame(step)};
  btn.addEventListener("pointerdown",down);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,stop));
}
function askReason(){
  openSheet("Ending early","<p class=\"s\">What pulled you off it? This is the only way the app learns "+
    "what actually derails you.</p>"+
    '<div class="card"><div class="chips" id="rs">'+
      REASONS.map(r=>'<button data-r="'+r[0]+'">'+esc(r[1])+"</button>").join("")+"</div>"+
      '<p class="note">Everything except &ldquo;finished early&rdquo; ends your streak of '+
      streak()+".</p></div>"+
    '<button class="btn ghost" id="keepGoing">Never mind, keep going</button>',
    el=>{
      el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{closeSheet();finishSession("bail",b.dataset.r)});
      el.querySelector("#keepGoing").onclick=closeSheet;
    });
}
</script>
<script>

        '<button class="hold" id="quit"><i></i><span>Hold to stop for the day</span></button>'+

/* ================= sheets ================= */
function fitSheet(){

  if(!h||!h.firstChild)return;

  let kb=0,vh=window.innerHeight;
  if(vv){kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);vh=vv.height}
  h.style.setProperty("--kb",Math.round(kb)+"px");
  h.style.setProperty("--sheetmax",Math.round(vh*0.92)+"px");
}
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}
window.addEventListener("resize",fitSheet);
function openSheet(title,body,mount){
  const h=document.getElementById("sheetHost");
  h.innerHTML='<div class="scrim" id="scrim"></div><div class="sheet"><div class="grab"></div>'+
    '<div class="in"><h3>'+esc(title)+"</h3>"+body+"</div></div>";
  document.getElementById("scrim").onclick=closeSheet;

}
function closeSheet(){document.getElementById("sheetHost").innerHTML="";document.body.style.overflow=""}

/* ================= focus tab ================= */

function bindFocus(el){

      :'<p class="note">Optional. Run <b>focus serve</b> on the laptop and put its address here.</p>')+
    '<p class="note">To start <b>both</b> halves with one tap, run <b>focus serve</b> and follow the '+
    "Shortcut it prints: Shortcuts can call your laptop directly, which this page cannot.</p></div>"+
    '<button class="btn ghost" id="dl" style="margin-top:10px">Download a backup</button>';
  return h;
}
function bindStats(el){
  const u=el.querySelector("#syncUrl");
  if(u)u.onchange=()=>{S.cfg.sync=u.value.trim();saveC();toast("Saved")};
  const b=el.querySelector("#syncNow");
  if(b)b.onclick=async()=>{
    if(!S.cfg.sync){toast("Put the laptop address in first");return}
    if(syncBlocked()){toast("Blocked as mixed content — use the Shortcut");return}
    const n=await syncUp();
    toast(n==null?"Could not reach the laptop":n+" new session"+(n===1?"":"s")+" sent");
  };
  const d=el.querySelector("#dl");
  if(d)d.onclick=()=>{
    const blob=new Blob([JSON.stringify({sessions:S.sessions,tasks:S.tasks},null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="deep-work-"+today()+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
}

/* ================= schedule + place check-ins =================
   iOS gives a web app no background location, so nothing here polls. A block is
   checked at exactly two moments: when you arrive and when you leave, each fired
   by an iOS Shortcuts personal automation that opens this app with ?block=..&e=..
   The app then takes one foreground fix and holds you to it. */
const KINDS=[["study","Study"],["class","Class"],["meal","Meal"],["gym","Gym"],["other","Other"]];
const DAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];
const kindName=k=>(KINDS.find(x=>x[0]===k)||[,"Other"])[1];

function haversine(a,b,c,d){                       /* metres between two fixes */
  const R=6371000, r=Math.PI/180;
  const dLat=(c-a)*r, dLon=(d-b)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}
function fix(){                                    /* one reading, never a watch */
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error("no geolocation"));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}),
      e=>rej(e), {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
  });
}
const hhmm=t=>{const[h,m]=String(t||"0:00").split(":").map(Number);return h*60+m};
const fmtTime=t=>{const[h,m]=String(t).split(":").map(Number);
  const ap=h<12?"am":"pm", hh=h%12===0?12:h%12;
  return hh+(m?":"+pad(m):"")+ap};
/* minutes late against the block's start, for today */
function lateness(b,when){
  const d=new Date(when), mins=d.getHours()*60+d.getMinutes();
  return mins-hhmm(b.start);
}
const blockById=id=>S.blocks.find(b=>b.id===id);
const checksFor=id=>S.checks.filter(c=>c.blockId===id);

/* attendance: one arrival per block per day counts */
function attendance(b){
  const arrivals=checksFor(b.id).filter(c=>c.evt==="arrive");
  const days=new Set(arrivals.filter(c=>c.ok).map(c=>dkey(new Date(c.at))));
  const tried=new Set(arrivals.map(c=>dkey(new Date(c.at))));
  const late=arrivals.filter(c=>c.ok&&c.late>0);
  return {made:days.size,tried:tried.size,
          avgLate:late.length?Math.round(late.reduce((a,c)=>a+c.late,0)/late.length):0,
          misses:arrivals.filter(c=>!c.ok).length};
}

/* ---- the check itself ---- */
async function runCheck(blockId,evt){
  const b=blockById(blockId);
  if(!b){toast("That block is gone");return}
  if(!b.place){toast("Set the place for "+b.name+" first");S.view="plan";render();return}
  showChecking(b,evt);
  let f=null,err=null;
  try{ f=await fix() }catch(e){ err=e }
  const rec={id:uid(),blockId:b.id,at:Date.now(),evt:evt,
             lat:f?f.lat:null,lon:f?f.lon:null,acc:f?f.acc:null,
             dist:null,ok:false,late:0,denied:!f};
  if(f){
    rec.dist=haversine(f.lat,f.lon,b.place.lat,b.place.lon);
    rec.ok=rec.dist<=(b.radius||120)+ (f.acc||0)/2;
    rec.late=evt==="arrive"?lateness(b,rec.at):0;
  }
  S.checks.push(rec); saveChecks(); syncUp();
  document.getElementById("runHost").innerHTML="";
  if(!f){
    toast(err&&err.code===1?"Location permission denied":"Could not get a fix");
    S.view="plan"; render(); return;
  }
  if(evt==="depart"){
    if(S.live){ finishSession("bail","interrupt"); }
    toast(rec.ok?"Left "+b.place.label:"Marked as gone from "+b.place.label);
    S.view="plan"; render(); return;
  }
  if(!rec.ok){
    toast("Not at "+b.place.label+" — "+rec.dist+" m away. Logged as a miss.");
    S.view="plan"; render(); return;
  }
  if(b.kind==="study"){ renderGate(b,rec); return; }
  toast("Checked in at "+b.place.label+(rec.late>0?", "+rec.late+" min late":", on time"));
  S.view="plan"; render();
}
function showChecking(b,evt){
  document.getElementById("runHost").innerHTML='<div class="run resume">'+
    '<p class="task">'+esc(b.name)+"</p>"+
    '<p class="course">'+(evt==="arrive"?"checking you are there":"checking you have left")+"</p>"+
    '<p class="bigmsg">&middot;&middot;&middot;</p>'+
    '<p class="est">Reading your location once. It is not tracked between checks.</p></div>';
}

/* You are at the library. This is the screen that will not let you just sit there. */
function renderGate(b,rec){
  const host=document.getElementById("runHost");
  const draw=()=>{
    const sinceMin=Math.round((Date.now()-rec.at)/60000);
    host.innerHTML='<div class="run resume gate">'+
      '<p class="task">You are at '+esc(b.place.label)+"</p>"+
      '<p class="course">'+esc(b.name)+" &middot; "+fmtTime(b.start)+"</p>"+
      '<p class="bigmsg">'+(rec.late>0?rec.late+" min late":"on time")+"</p>"+
      '<p class="est">Pick something and start the clock.'+
        (sinceMin>=2?" You have been standing here "+sinceMin+" min.":"")+"</p>"+
      '<div class="foot">'+
        '<button class="btn" id="gateGo">Choose an assignment</button>'+
        '<button class="hold" id="gateSkip"><i></i><span>Hold to skip this block</span></button>'+
      "</div></div>";
    document.getElementById("gateGo").onclick=()=>{
      clearInterval(tick);tick=null;host.innerHTML="";
      if(b.task)draft.task=b.task;
      if(b.dur)draft.dur=b.dur;
      S.view="focus";render();
      const t=document.getElementById("fTask"); if(t&&!t.value)t.focus();
      toast("Name it and start");
    };
    holdToConfirm(document.getElementById("gateSkip"),()=>{
      rec.skipped=true; saveChecks();
      clearInterval(tick);tick=null;host.innerHTML="";
      S.view="plan";render();toast("Skipped. That is on the record.");
    });
  };
  draw();
  clearInterval(tick); tick=setInterval(draw,60000);
}

/* ---- the plan tab ---- */
function planHTML(){
  const now=new Date(), dow=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  const todays=S.blocks.filter(b=>b.days.includes(dow)).sort((a,b)=>hhmm(a.start)-hhmm(b.start));
  let h='<div class="head"><h1>Where you should be</h1>'+
    "<p>Checked when you arrive and when you leave. Nothing in between.</p></div>";
  if(!S.blocks.length)
    h+='<div class="empty">No blocks yet.<br>Add the places your day is supposed to happen in.</div>';
  else{
    h+='<div class="sectlab">Today</div>';
    if(!todays.length)h+='<div class="card"><p class="note" style="margin:0">Nothing scheduled today.</p></div>';
    else h+='<div class="card">'+todays.map(b=>{
      const a=attendance(b), on=mins>=hhmm(b.start)&&mins<hhmm(b.end);
      const doneToday=checksFor(b.id).some(c=>c.evt==="arrive"&&c.ok&&dkey(new Date(c.at))===today());
      return '<div class="row"><div class="main"><div class="nm">'+esc(b.name)+
        '<span class="pill '+(doneToday?"done":on?"brk":"")+'">'+
          (doneToday?"checked in":on?"now":kindName(b.kind).toLowerCase())+"</span></div>"+
        '<div class="sub">'+fmtTime(b.start)+"&ndash;"+fmtTime(b.end)+
          (b.place?" &middot; "+esc(b.place.label):" &middot; no place set")+"</div></div>"+
        '<div class="rt"><button class="link" data-check="'+b.id+'">I am here</button></div></div>';
    }).join("")+"</div>";

    h+='<div class="sectlab">All blocks<button class="link" id="addBlock">+ Add</button></div><div class="card">'+
      S.blocks.slice().sort((a,b)=>hhmm(a.start)-hhmm(b.start)).map(b=>{
        const a=attendance(b);
        return '<button class="row" style="width:100%;text-align:left" data-edit="'+b.id+'">'+
        '<div class="main"><div class="nm">'+esc(b.name)+"</div>"+
        '<div class="sub">'+b.days.map(d=>DAYS[d]).join(" ")+" &middot; "+fmtTime(b.start)+
          (a.tried?" &middot; made "+a.made+" of "+a.tried+(a.avgLate?", avg "+a.avgLate+" min late":""):"")+
          "</div></div><div class=\"rt\"><div class=\"mins\">&rsaquo;</div></div></button>";
      }).join("")+"</div>";
  }
  h+='<button class="btn'+(S.blocks.length?" ghost":"")+'" id="addBlock2" style="margin-top:12px">Add a block</button>'+
     '<button class="btn ghost" id="howto" style="margin-top:9px">How the automatic check works</button>';
  return h;
}

function bindPlan(el){
  el.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>runCheck(b.dataset.check,"arrive"));
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openBlock(blockById(b.dataset.edit)));
  ["addBlock","addBlock2"].forEach(id=>{const n=el.querySelector("#"+id);if(n)n.onclick=()=>openBlock(null)});
  const hw=el.querySelector("#howto"); if(hw)hw.onclick=howto;
}

function openBlock(b){
  const isNew=!b;
  b=b||{id:uid(),name:"",kind:"study",days:[1,2,3,4,5],start:"09:00",end:"11:00",
        place:null,radius:120,task:"",dur:S.cfg.dur};
  const body=
    '<div class="card">'+
      '<div class="field"><span class="lab">What is it</span>'+
        '<input id="bName" type="text" value="'+esc(b.name)+'" placeholder="Morning at the library"></div>'+
      '<div class="field"><span class="lab">Kind</span><div class="chips" id="bKind">'+
        KINDS.map(k=>'<button data-k="'+k[0]+'" aria-pressed="'+(b.kind===k[0])+'">'+k[1]+"</button>").join("")+
      "</div></div>"+
      '<div class="field"><span class="lab">Days</span><div class="chips" id="bDays">'+
        DAYS.map((d,i)=>'<button data-d="'+i+'" aria-pressed="'+(b.days.includes(i))+'">'+d+"</button>").join("")+
      "</div></div>"+
      '<div class="grid2">'+
        '<div class="field"><span class="lab">Start</span><input id="bStart" type="time" value="'+esc(b.start)+'"></div>'+
        '<div class="field"><span class="lab">End</span><input id="bEnd" type="time" value="'+esc(b.end)+'"></div>'+
      "</div>"+
    "</div>"+
    '<div class="card"><span class="lab">Place</span>'+
      '<p class="note" id="placeNow" style="margin:0 0 10px">'+
        (b.place?esc(b.place.label)+" &middot; "+b.place.lat.toFixed(5)+", "+b.place.lon.toFixed(5)
               :"Not set. Stand where the block happens and tap below.")+"</p>"+
      '<div class="field"><input id="bLabel" type="text" value="'+esc(b.place?b.place.label:"")+
        '" placeholder="Library West, 3rd floor"></div>'+
      '<button class="btn ghost" id="grab">Use my location now</button>'+
      '<div class="field" style="margin-top:12px"><span class="lab">How close counts (metres)</span>'+
        '<input id="bRadius" type="number" inputmode="numeric" value="'+(b.radius||120)+'"></div>'+
      '<p class="note">GPS indoors is good to maybe 20&ndash;50 m, so keep this generous. 120 m is a '+
      "sensible default for a building.</p></div>"+
    (b.kind==="study"?'<div class="card"><span class="lab">When you arrive, start on</span>'+
      '<div class="field"><input id="bTask" type="text" value="'+esc(b.task||"")+
      '" placeholder="Leave blank to choose each time"></div></div>':"")+
    '<button class="btn" id="bSave">'+(isNew?"Add this block":"Save")+"</button>"+
    (isNew?"":'<button class="btn warn" id="bDel" style="margin-top:9px">Delete this block</button>')+
    (isNew?"":'<button class="btn ghost" id="bShort" style="margin-top:9px">Shortcut links for this block</button>');

  openSheet(isNew?"New block":"Edit block",body,el=>{
    let kind=b.kind, days=b.days.slice(), place=b.place;
    el.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{
      kind=x.dataset.k;
      el.querySelectorAll("[data-k]").forEach(y=>y.setAttribute("aria-pressed",String(y===x)));
    });
    el.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{
      const i=+x.dataset.d, at=days.indexOf(i);
      if(at>=0)days.splice(at,1); else days.push(i);
      x.setAttribute("aria-pressed",String(days.includes(i)));
    });
    el.querySelector("#grab").onclick=async()=>{
      const p=el.querySelector("#placeNow"); p.textContent="Getting a fix…";
      try{
        const f=await fix();
        place={lat:f.lat,lon:f.lon,label:el.querySelector("#bLabel").value.trim()||"Here"};
        p.textContent=place.label+" · "+f.lat.toFixed(5)+", "+f.lon.toFixed(5)+" (±"+f.acc+" m)";
      }catch(e){ p.textContent=e&&e.code===1?"Permission denied — allow location for this site."
                                            :"Could not get a fix. Try outside a lift." }
    };
    el.querySelector("#bSave").onclick=()=>{
      const name=el.querySelector("#bName").value.trim();
      if(!name){toast("Give the block a name");return}
      if(!days.length){toast("Pick at least one day");return}
      const lbl=el.querySelector("#bLabel").value.trim();
      if(place&&lbl)place.label=lbl;
      const rec={id:b.id,name:name,kind:kind,days:days.sort(),
        start:el.querySelector("#bStart").value||"09:00",
        end:el.querySelector("#bEnd").value||"11:00",
        place:place,radius:Math.max(25,+el.querySelector("#bRadius").value||120),
        task:(el.querySelector("#bTask")||{value:""}).value.trim(),dur:b.dur||S.cfg.dur};
      const i=S.blocks.findIndex(x=>x.id===rec.id);
      if(i>=0)S.blocks[i]=rec; else S.blocks.push(rec);
      saveBlocks(); closeSheet(); S.view="plan"; render(); toast(isNew?"Block added":"Saved");
    };
    const del=el.querySelector("#bDel");
    if(del)del.onclick=()=>{
      S.blocks=S.blocks.filter(x=>x.id!==b.id);
      S.checks=S.checks.filter(c=>c.blockId!==b.id);
      saveBlocks(); saveChecks(); closeSheet(); render(); toast("Deleted");
    };
    const sh=el.querySelector("#bShort");
    if(sh)sh.onclick=()=>shortcutSheet(b);
  });
}

const appURL=()=>location.origin+location.pathname.replace(/[^/]*$/,"");
function shortcutSheet(b){
  const base=appURL();
  const arrive=base+"?block="+b.id+"&e=arrive";
  const depart=base+"?block="+b.id+"&e=depart";
  openSheet("Shortcut links",
    '<p class="s">Two personal automations in the iPhone Shortcuts app. Both use '+
    "<b>Open URL</b> as their only action, and both need <b>Run Immediately</b> turned on.</p>"+
    '<div class="card"><span class="lab">When I arrive</span>'+
      '<p class="urlbox" id="u1">'+esc(arrive)+"</p>"+
      '<button class="btn ghost" data-copy="'+esc(arrive)+'">Copy this link</button></div>'+
    '<div class="card"><span class="lab">When I leave</span>'+
      '<p class="urlbox" id="u2">'+esc(depart)+"</p>"+
      '<button class="btn ghost" data-copy="'+esc(depart)+'">Copy this link</button></div>'+

function howto(){
  openSheet("How the checking works",
    '<p class="s">Your phone will not let a web app watch your location in the background — only '+
    "while it is open and in front of you. So this never runs in the background, and never tracks "+
    "you between checks.</p>"+
    '<div class="card"><span class="lab">What actually happens</span><p class="note" style="margin:0">'+
    "An iPhone automation opens this app the moment you arrive somewhere, or leave it. The app takes "+
    "one location reading, compares it to the block's place, and writes down whether you were there "+
    "and how late. If it is a study block and you really are there, you get a screen that will not "+
    "go away until you either start a session or hold down to record a skip.</p></div>"+
    '<div class="card"><span class="lab">What it cannot catch</span><p class="note" style="margin:0">'+
    "Leaving early is only caught if you have the leave automation set up, and sitting in the "+
    "building doing nothing is not caught at all. It catches skipping and lateness, which is the "+
    "part you said you actually lose.</p></div>"+
    '<div class="card"><span class="lab">Set it up once</span><p class="note" style="margin:0">'+
    "Open a block, tap <b>Shortcut links for this block</b>, and follow the three lines there. "+
    "You need one arrive automation and one leave automation per place, not per block.</p></div>");
}

/* ================= router ================= */
const VIEWS=["focus","plan","log","stats"];
function render(){
  VIEWS.forEach(v=>document.getElementById("nav"+v).setAttribute("aria-current",String(S.view===v)));
  const el=document.getElementById("screen");
  el.innerHTML=S.view==="focus"?focusHTML():S.view==="plan"?planHTML():
               S.view==="log"?logHTML():statsHTML();
  if(S.view==="focus")bindFocus(el);
  if(S.view==="plan")bindPlan(el);
  if(S.view==="log")bindLog(el);
  if(S.view==="stats")bindStats(el);
  document.getElementById("tabbar").hidden=false;
}
VIEWS.forEach(v=>
  document.getElementById("nav"+v).onclick=()=>{S.view=v;window.scrollTo(0,0);render()});

/* a session in progress survives a reload, a crash, or the phone locking */
if(S.live){
  if(Date.now()-S.live.start>=S.live.dur){
    const l=S.live;
    S.live=null;saveL();
    const rec={id:l.id,kind:l.kind||"work",task:l.task,course:l.course,at:l.start,
      planned:mins(l.dur),actual:mins(l.dur),est:l.est,ended:"done",reason:"",
      leaves:l.leaves.length,awaySec:l.leaves.reduce((a,b)=>a+b,0)};
    S.sessions.push(rec);
    if(rec.kind!=="break"){const t=S.tasks[keyOf(l.task)];if(t){t.spent+=rec.actual;t.sessions++}}
    saveS();saveT();
    /* a break that ran out while you were away still has to be answered */
    if(rec.kind==="break"){
      S.pending={task:l.task,course:l.course,est:l.est,dur:S.cfg.dur,
                 brk:rec.planned,endedAt:l.start+l.dur,recId:rec.id};
      saveP();
    }
  }else{ keepAwake(true); renderRun(); }
}
render();
if(!S.live&&S.pending)renderResume();

/* Shortcuts opens us as .../?block=<id>&e=arrive|depart */
(function(){
  const q=new URLSearchParams(location.search);
  const id=q.get("block"), e=q.get("e");
  if(!id)return;
  history.replaceState(null,"",location.pathname);        /* do not re-fire on reload */
  if(S.live&&e!=="depart"){toast("Already in a session");return}
  runCheck(id,e==="depart"?"depart":"arrive");
})();
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
syncUp();
